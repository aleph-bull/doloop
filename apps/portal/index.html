<!doctype html>
<html lang="en" data-theme="dark" data-accent="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Komogon</title>
    <meta
      name="description"
      content="Plan your study week, focus with a timer, track your hours, and share your progress with friends. Free to use."
    />
    <!-- Search results show a site's icon only when it has one of 48px or more: the .ico (16, 32
         and 48) and the 192. The 16 and 32 stay for browser tabs. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- Link previews (messages, Discord, socials) when someone shares komogon.app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Komogon" />
    <meta property="og:url" content="https://www.komogon.app/" />
    <meta property="og:title" content="Komogon" />
    <meta
      property="og:description"
      content="A better place to plan, focus, and keep track of your studying."
    />
    <meta property="og:image" content="https://app.komogon.app/og.jpg?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Komogon: Your study sessions, on record." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The name search results put above the address, instead of "komogon.app". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Komogon",
        "alternateName": "komogon.app",
        "url": "https://www.komogon.app/",
        "publisher": { "@id": "https://app.komogon.app/#org" }
      }
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#5b55eb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Komogon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
