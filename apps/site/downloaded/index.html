<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Thank you for installing Komogon</title>
    <meta name="description" content="Thank you for installing the Komogon extension." />
    <!-- Opened by the extension right after it is added; not a page for search. -->
    <meta name="robots" content="noindex, noai, noimageai" />
    <meta name="theme-color" content="#2d2533" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Satoshi-Variable.woff2" crossorigin />
    <link rel="preload" as="image" href="/backgrounds/cotton-candy.webp" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/downloaded.css" />
    <script type="module" src="/src/downloaded.js"></script>
  </head>
  <body class="got">
    <!-- Dawn Skies, the app's own default look: the Cotton Candy photo under its dark wash. -->
    <div class="got-sky" aria-hidden="true"></div>

    <header class="site-nav" role="banner">
      <a class="site-brand" href="/" aria-label="Komogon home">
        <img class="site-brand-mark" src="/logo-small.png" alt="" width="28" height="28" />
        <span class="site-wordmark">Komogon</span>
      </a>
      <div class="site-nav-actions">
        <a class="cta cta-light cta-sm" href="https://komogon.app">Open the app</a>
      </div>
    </header>

    <main class="got-hero">
      <h1 class="display got-title">Thank you for installing<br />Komogon!</h1>
      <p class="lede got-lede">Your timer and your sessions, one click away in any tab.</p>
      <div class="cta-row got-actions">
        <a class="cta cta-primary" href="https://komogon.app/extension">Open Komogon</a>
        <a class="cta cta-glass" href="/">Home</a>
      </div>
    </main>
  </body>
</html>
