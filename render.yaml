# Render blueprint for the Komodon API (closed alpha). The portal is on Vercel
# (apps/portal/vercel.json); data is in a hosted Postgres (Neon). Setup: docs/ALPHA.md.
#
# Values marked `sync: false` are asked for when the blueprint is first applied, and live
# only in Render's dashboard, never in the repo.
services:
  - type: web
    name: komogon-api
    runtime: node
    plan: free # sleeps after 15 idle minutes; the first request then takes ~30-60 s
    region: ohio
    buildCommand: npx -y pnpm@12.5.1 install --frozen-lockfile && npx -y pnpm@12.5.1 --filter @komogon/api build
    # From apps/api so the migrations beside dist/ are found.
    startCommand: cd apps/api && node dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: HOST
        value: 0.0.0.0
      # Signs the API's own email-and-password sign-ins; changing it signs everyone out
      - key: AUTH_SECRET
        generateValue: true
      # Resend sending key; verify komogon.app in Resend before enabling live mail.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Komodon <noreply@komogon.app>

      # Render's proxy adds the caller's address to X-Forwarded-For; trust that one entry
      # so the sign-in limits count each caller, not the proxy
      - key: TRUST_PROXY_HOPS
        value: '1'
      # Optional "Continue with Google": a Web OAuth client id whose authorised JavaScript
      # origins include the portal's address
      - key: GOOGLE_SIGNIN_CLIENT_ID
        sync: false
      # Postgres connection string (Neon, or any hosted Postgres)
      - key: DATABASE_URL
        sync: false
      # The Vercel address, e.g. https://komogon.vercel.app (no trailing slash)
      - key: CORS_ORIGINS
        sync: false
      - key: PORTAL_URL
        sync: false
      # Optional invite list (emails or @domain, comma separated); empty lets anyone sign up
      - key: ALLOWED_EMAILS
        sync: false
      # Admins: the Admin page (every account, its data, setting a new password)
      - key: ADMIN_EMAILS
        value: zachzhao2015@gmail.com
